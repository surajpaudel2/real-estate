name: Real Estate Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'real-estate-backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'real-estate-backend/**'

defaults:
  run:
    working-directory: real-estate-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: real-estate-backend/pom.xml

      - name: Run tests
        run: ./mvnw -B test

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: real-estate-backend/pom.xml

      - name: Build and push image with Jib
        run: |
          ./mvnw -B compile jib:build \
            -Dimage=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/real-estate-backend:${{ github.sha }} \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}
          
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/real-estate-backend:${{ github.sha }}
            docker stop real-estate-backend || true
            docker rm real-estate-backend || true
            docker run -d -p 8080:8080 --name real-estate-backend ${{ secrets.DOCKERHUB_USERNAME }}/real-estate-backend:${{ github.sha }}
            docker image prune -f