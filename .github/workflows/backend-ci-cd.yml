name: Real Estate Backend CI/CD
on:
  push:
    branches: [main]
    paths:
      - 'real-estate-backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'real-estate-backend/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: real-estate-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: real-estate-backend/pom.xml
      - name: Run tests
        run: ./mvnw -B test
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: real-estate-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: real-estate-backend/pom.xml
      - name: Build and push image with Jib
        run: |
          ./mvnw -B compile jib:build \
            -Dimage=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/real-estate-backend:${{ github.sha }} \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{