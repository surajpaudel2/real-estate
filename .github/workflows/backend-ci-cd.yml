name: Real Estate Backend CI/CD
on:
  push:
    branches: [main]
    paths:
      - 'real-estate-backend/**'
      - '.github/workflows/backend-ci-cd.yml'
      - '.github/workflows/deploy.yml'
      - '.github/actions/setup-backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'real-estate-backend/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: real-estate-backend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-backend
      - name: Run tests
        run: ./mvnw -B test

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: real-estate-backend
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-backend
      - name: Build and push image with Jib
        run: |
          ./mvnw -B compile jib:build \
            -Dimage=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/real-estate-backend:${{ github.sha }} \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record pushed image ref
        id: image
        run: echo "ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/real-estate-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # Reusable deploy job (.github/workflows/deploy.yml) — ships the compose
  # files + secret-backed env to EC2 and runs `docker compose up`, replacing
  # the old bare `docker run` that had no DB/mail/JWT config wired in at all.
  deploy:
    needs: build-and-push
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.build-and-push.outputs.image }}
    secrets: inherit
