name: Real Estate Backend CI/CD
on:
  push:
    branches: [main]
    paths:
      - 'real-estate-backend/**'
      - '.github/workflows/backend-ci-cd.yml'
      - '.github/workflows/deploy.yml'
      - '.github/actions/setup-backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'real-estate-backend/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: real-estate-backend
    services:
      # contextLoads() boots the full Spring context, which needs a real
      # datasource — the dev profile's DB_HOST defaults to localhost:3306,
      # so a service container standing in for that is enough (no compose,
      # no /run/secrets involved here).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: real_estate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # Stand-in values for properties that have no default outside
      # Docker/.env (spring.datasource.*, MAIL_USERNAME, spring.mail.password,
      # jwt.secret) — real ones only ever live in secrets/ or CI secrets,
      # never needed for a context-load smoke test.
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: test
      MAIL_USERNAME: ci@example.com
      SPRING_MAIL_PASSWORD: test
      JWT_SECRET: ci-only-test-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-backend
      - name: Run tests
        run: ./mvnw -B test

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: real-estate-backend
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-backend
      - name: Build and push image with Jib
        run: |
          ./mvnw -B compile jib:build \
            -Dimage=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/real-estate-backend:${{ github.sha }} \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record pushed image ref
        id: image
        run: echo "ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/real-estate-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # Reusable deploy job (.github/workflows/deploy.yml) — ships the compose
  # files + secret-backed env to EC2 and runs `docker compose up`, replacing
  # the old bare `docker run` that had no DB/mail/JWT config wired in at all.
  deploy:
    needs: build-and-push
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.build-and-push.outputs.image }}
    secrets: inherit
