name: Deploy via SSH (reusable)

# Reusable across services: today only backend-ci-cd.yml calls this, but
# it's parameterized (image / compose files / remote path) so a future
# frontend workflow can call the same SSH/security-group/compose dance
# instead of duplicating it.
on:
  workflow_call:
    inputs:
      image_tag:
        description: >
          Tag to deploy (the commit SHA build-and-push pushed). Combined
          here with the DOCKERHUB_USERNAME secret and the fixed repo name
          to build $APP_IMAGE — kept as just the tag (not the full ref) so
          the secret never has to cross the job boundary as a job output,
          which GitHub Actions silently empties.
        required: true
        type: string
      compose_files:
        description: Comma-separated files to ship to the remote host and run with `docker compose -f`.
        required: false
        type: string
        default: "docker-compose.yml,docker-compose.prod.yml,.env.common"
      remote_path:
        description: Directory on the remote host holding the compose files + secrets.
        required: false
        type: string
        default: "real-estate-deploy"
      aws_region:
        required: false
        type: string
        default: "ap-southeast-2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Allow runner IP for SSH
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr ${RUNNER_IP}/32

      - name: Ship compose files to remote host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ${{ inputs.compose_files }}
          target: ${{ inputs.remote_path }}

      - name: Write secrets, .env.prod, and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ inputs.remote_path }}
            umask 077
            mkdir -p secrets/prod

            # Real secret values — written straight to files, never passed
            # as container env vars. Matches secrets/prod/*.example in the repo.
            printf '%s' "${{ secrets.PROD_DB_USERNAME }}"   > secrets/prod/spring.datasource.username
            printf '%s' "${{ secrets.PROD_DB_PASSWORD }}"   > secrets/prod/spring.datasource.password
            printf '%s' "${{ secrets.PROD_MAIL_PASSWORD }}" > secrets/prod/spring.mail.password
            printf '%s' "${{ secrets.PROD_JWT_SECRET }}"    > secrets/prod/jwt.secret

            # Non-secret prod env — mirrors .env.prod's shape from the repo
            # (gitignored there, so it's generated here instead).
            printf 'SPRING_PROFILES_ACTIVE=prod\nMAIL_USERNAME=%s\n' "${{ secrets.PROD_MAIL_USERNAME }}" > .env.prod

            # .env.docker (mysql service's MYSQL_DATABASE) is also gitignored
            # and not shipped — derived from .env.common's DB_NAME (just
            # shipped via scp) instead of a second hardcoded copy of the
            # same value, so the two can't drift apart.
            grep '^DB_NAME=' .env.common | sed 's/^DB_NAME=/MYSQL_DATABASE=/' > .env.docker

            export APP_IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/real-estate-backend:${{ inputs.image_tag }}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: Revoke runner IP
        if: always()
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr ${RUNNER_IP}/32
