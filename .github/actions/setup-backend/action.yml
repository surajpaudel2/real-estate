name: Setup backend build environment
description: >
  JDK 26 + Maven cache — the steps shared by every job that needs to
  build real-estate-backend (test, build-and-push). Kept as a composite
  action so a future job (or another workflow) can reuse it without
  duplicating the setup steps. Callers must run actions/checkout
  themselves first — a local action reference (./.github/actions/...)
  can only be resolved after the repo is already checked out, so
  checkout can't live inside this action.

runs:
  using: composite
  steps:
    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: real-estate-backend/pom.xml
