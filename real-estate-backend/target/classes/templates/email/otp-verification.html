<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Verify your account</title>
</head>
<body style="font-family: sans-serif; background-color: #f4f4f4; padding: 24px;">
<div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px;">
    <h2 style="margin-top: 0;">Verify your account</h2>
    <p>Hi <span th:text="${name}">there</span>,</p>
    <p>Use the code below to verify your account. It expires in 10 minutes.</p>
    <div style="font-size: 32px; font-weight: bold; letter-spacing: 6px; text-align: center; padding: 16px; background: #f0f0f0; border-radius: 6px; margin: 24px 0;">
        <span th:text="${otp}">123456</span>
    </div>
    <p style="color: #666; font-size: 13px;">If you didn't request this, you can safely ignore this email.</p>
</div>
</body>
</html>
