spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

# spring.datasource.username/password, spring.mail.password, and jwt.secret
# come only from /run/secrets/ (configtree import in application.yml) — no
# defaults, so a missing prod secret fails startup loudly instead of
# silently running with an empty credential.
