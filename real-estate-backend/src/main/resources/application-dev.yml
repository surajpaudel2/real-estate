spring:
  config:
    # Local (non-Docker) fallback: a .env file in Spring-property-path
    # format, e.g. `spring.datasource.username=root`. See Step 3.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:real_estate}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
# spring.datasource.username/password, spring.mail.password, and jwt.secret
# are deliberately absent here — they're standard Spring properties bound
# directly from /run/secrets/ (Docker, see application.yml) or .env (local
# non-Docker), never hardcoded or placeholder-indirected.