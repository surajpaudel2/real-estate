services:
  app:
    image: real-estate-backend:latest
    container_name: real-estate-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/test"]
      interval: 15s
      timeout: 5s
      retries: 5